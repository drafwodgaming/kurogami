services:
  discordbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kurogami
    env_file: .env
    environment:
      - NODE_ENV=production
    networks:
      - botnet
    restart: always
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    container_name: mongodb
    ports:
      - '127.0.0.1:27017:27017'
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - botnet
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:

networks:
  botnet:
    driver: bridge